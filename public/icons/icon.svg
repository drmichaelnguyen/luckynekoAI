<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="NekoZeni">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="55%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- ears -->
  <path d="M148 232 L118 120 L200 168 Z" fill="#fca5a5" stroke="#7f1d1d" stroke-width="8" stroke-linejoin="round"/>
  <path d="M364 232 L394 120 L312 168 Z" fill="#fca5a5" stroke="#7f1d1d" stroke-width="8" stroke-linejoin="round"/>
  <!-- head -->
  <ellipse cx="256" cy="248" rx="150" ry="132" fill="url(#face)" stroke="#b45309" stroke-width="10"/>
  <!-- eyes -->
  <path d="M188 236 Q220 200 252 236" stroke="#422006" stroke-width="18" stroke-linecap="round" fill="none"/>
  <path d="M260 236 Q292 200 324 236" stroke="#422006" stroke-width="18" stroke-linecap="round" fill="none"/>
  <!-- nose -->
  <path d="M256 272 L232 304 H280 Z" fill="#fb7185"/>
  <!-- collar -->
  <path d="M120 340 Q256 392 392 340" stroke="#dc2626" stroke-width="36" stroke-linecap="round" fill="none"/>
  <!-- bell -->
  <circle cx="256" cy="352" r="48" fill="#facc15" stroke="#b45309" stroke-width="8"/>
  <circle cx="256" cy="352" r="10" fill="#92400e"/>
  <!-- coin -->
  <circle cx="140" cy="360" r="44" fill="#fde047" stroke="#b45309" stroke-width="8"/>
  <text x="140" y="378" text-anchor="middle" font-size="52" font-weight="700" fill="#713f12" font-family="system-ui,sans-serif">¥</text>
  <!-- waving paw -->
  <ellipse cx="392" cy="300" rx="56" ry="68" fill="url(#face)" stroke="#b45309" stroke-width="10" transform="rotate(-12 392 300)"/>
</svg>
